[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-voice-interface"
version = "0.1.0"
description = "A model-agnostic voice interaction layer for agents and robots"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/avi"]

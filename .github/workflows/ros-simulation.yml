name: ROS 2 simulated device
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/robot/**'
      - 'src/avip_client/**'
      - 'tests/test_jev31_mock_device.py'
      - '.github/workflows/ros-simulation.yml'
permissions:
  contents: read
jobs:
  jazzy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise both directions on a local Jazzy graph
        run: |
          docker pull ros:jazzy-ros-base
          image=$(docker image inspect ros:jazzy-ros-base --format '{{index .RepoDigests 0}}')
          echo "Using $image"
          docker run --rm -v "$GITHUB_WORKSPACE:/avi:ro" -w /avi \
            -e ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST -e ROS_DOMAIN_ID=31 \
            "$image" bash -ec '
              apt-get -qq update
              apt-get -qq install -y python3-venv
              python3 -m venv --system-site-packages /tmp/avi-ros
              /tmp/avi-ros/bin/pip install "websockets>=13,<18"
              export PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="src:$PYTHONPATH"
              /tmp/avi-ros/bin/python -c "import rclpy; from std_msgs.msg import String"
              /tmp/avi-ros/bin/python -m unittest discover -s tests -p test_jev31_mock_device.py -v
            '
